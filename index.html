<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Janmashtami - Krishna's Birthday</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #4facfe 100%);
            min-height: 100vh;
        }
        
        /* Floating Petals Animation */
        .petals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ff6b6b, #ffd93d);
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            opacity: 0.7;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }
        
        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #e8f4f8;
            font-weight: 300;
        }
        
        /* Krishna Card */
        .krishna-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }
        
        .krishna-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shine 3s ease-in-out infinite;
        }
        
        @keyframes shine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }
        
        .krishna-emoji {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            display: inline-block;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        .birthday-message {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .devotional-text {
            font-size: 1.1rem;
            color: #e8f4f8;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        /* Interactive Elements */
        .interactive-section {
            margin-top: 30px;
        }
        
        .blessing-button {
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(247, 147, 30, 0.3);
            margin: 0 10px 15px;
        }
        
        .blessing-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(247, 147, 30, 0.4);
        }
        
        .blessing-button:active {
            transform: translateY(0);
        }
        
        /* Krishna Image Styling */
        .krishna-image-container {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }
        
        .krishna-image {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            border: 8px solid;
            border-image: linear-gradient(45deg, #1e40af, #ffd700, #1e40af, #ffd700) 1;
            box-shadow: 
                0 0 30px rgba(31, 64, 175, 0.4),
                0 0 60px rgba(255, 215, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: divine-glow 3s ease-in-out infinite;
            position: relative;
        }
        
        .krishna-image-container::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #1e40af,
                #3b82f6,
                #ffd700,
                #f59e0b,
                #1e40af
            );
            animation: rotate-border 4s linear infinite;
            z-index: -1;
        }
        
        .krishna-image-container::after {
            content: '🕉️';
            position: absolute;
            top: -20px;
            right: 10px;
            font-size: 2rem;
            animation: float 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
        }
        
        @keyframes divine-glow {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(31, 64, 175, 0.4),
                    0 0 60px rgba(255, 215, 0, 0.3),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(31, 64, 175, 0.6),
                    0 0 80px rgba(255, 215, 0, 0.5),
                    inset 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }
        
        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(10deg); }
        }

        /* Decorative Elements */
        .peacock-feather {
            position: absolute;
            font-size: 3rem;
            animation: sway 4s ease-in-out infinite;
        }
        
        .feather-1 { top: 20%; left: 10%; animation-delay: 0s; }
        .feather-2 { top: 60%; right: 15%; animation-delay: 1s; }
        .feather-3 { bottom: 20%; left: 20%; animation-delay: 2s; }
        
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(5deg) translateY(-10px); }
        }
        
        /* Blessing Display */
        .blessing-display {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border-left: 4px solid #ffd700;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        
        .blessing-text {
            color: #fff;
            font-size: 1.1rem;
            font-style: italic;
            text-align: left;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
            .krishna-card { padding: 25px; margin: 0 10px; }
            .birthday-message { font-size: 1.4rem; }
            .devotional-text { font-size: 1rem; }
            .peacock-feather { display: none; }
        }
    </style>

            <p class="devotional-text">
                "On this sacred day of Janmashtami, we celebrate the birth of Lord Krishna, 
                the embodiment of love, wisdom, and divine playfulness. May His blessings 
                fill your life with joy, peace, and spiritual bliss."
            </p>
            
            <div class="interactive-section">
                <button class="blessing-button" onclick="showBlessing()">🪷 Receive Divine Blessings</button>
                <button class="blessing-button" onclick="playFlute()">🪈 Play Krishna's Flute</button>
                <button class="blessing-button" onclick="showLove()">💙 Send Love to Krishna</button>
            </div>
            
            <div class="blessing-display" id="blessingDisplay">
                <p class="blessing-text" id="blessingText"></p>
            </div>
        </div>
    </div>
    
    <script>
        // Simple function to replace image URL if needed
        function updateKrishnaImage(newUrl) {
            const imgElement = document.getElementById('krishnaImg');
            if (imgElement) {
                imgElement.src = newUrl;
            }
        }
        
        // Create floating petals
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 3 + 2) + 's';
            petal.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('petals').appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 5000);
        }
        
        // Create petals continuously
        setInterval(createPetal, 300);
        
        // Blessing messages
        const blessings = [
            "🕉️ May Krishna's divine love guide you always",
            "🌸 Let His flute melody bring peace to your heart",
            "⭐ May you find joy in life's simple moments, just like Bal Krishna",
            "🦋 Krishna's wisdom illuminates your path forward",
            "🌺 His divine protection surrounds you with light",
            "🎭 May you dance through life with Krishna's playful spirit",
            "🌙 Let His teachings bring clarity to your mind",
            "💫 Krishna's grace blesses your journey ahead"
        ];
        
        function showBlessing() {
            const display = document.getElementById('blessingDisplay');
            const text = document.getElementById('blessingText');
            const randomBlessing = blessings[Math.floor(Math.random() * blessings.length)];
            
            text.textContent = randomBlessing;
            display.style.display = 'block';
            
            // Add sparkle effect
            createSparkles();
        }
        
        function playFlute() {
            const display = document.getElementById('blessingDisplay');
            const text = document.getElementById('blessingText');
            
            text.textContent = "🎵 Listen... Krishna's enchanting flute melody fills the air, bringing divine harmony to all souls 🎶";
            display.style.display = 'block';
            
            // Add musical notes animation
            for(let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createMusicalNote();
                }, i * 200);
            }
        }
        
        function showLove() {
            const display = document.getElementById('blessingDisplay');
            const text = document.getElementById('blessingText');
            
            text.textContent = "💙 Your love reaches Krishna's heart. He smiles upon you with infinite compassion and divine grace 🙏";
            display.style.display = 'block';
            
            // Create heart particles
            createHeartParticles();
        }
        
        function createSparkles() {
            for(let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.innerHTML = '✨';
                    sparkle.style.position = 'fixed';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.fontSize = '1.5rem';
                    sparkle.style.pointerEvents = 'none';
                    sparkle.style.zIndex = '1000';
                    sparkle.style.animation = 'fadeIn 1s ease-out forwards';
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 2000);
                }, i * 100);
            }
        }
        
        function createMusicalNote() {
            const notes = ['🎵', '🎶', '🎼'];
            const note = document.createElement('div');
            note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
            note.style.position = 'fixed';
            note.style.left = Math.random() * 100 + '%';
            note.style.top = Math.random() * 50 + 25 + '%';
            note.style.fontSize = '2rem';
            note.style.pointerEvents = 'none';
            note.style.zIndex = '1000';
            note.style.animation = 'bounce 2s ease-out forwards';
            document.body.appendChild(note);
            
            setTimeout(() => note.remove(), 3000);
        }
        
        function createHeartParticles() {
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '💙';
                    heart.style.position = 'fixed';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = Math.random() * 100 + '%';
                    heart.style.fontSize = '1.8rem';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '1000';
                    heart.style.animation = 'bounce 1.5s ease-out forwards';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 2500);
                }, i * 150);
            }
        }
        
        // Add some initial sparkles when page loads
        window.addEventListener('load', () => {
            setTimeout(createSparkles, 1000);
        });
    </script>
